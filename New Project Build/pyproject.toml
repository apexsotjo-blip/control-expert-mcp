[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ddt-mirror"
version = "1.2.0"
description = "One-click Control Expert DDT-to-HMI/RTU tag mirroring: located mirror variables, ST mirror sections, address map, Vijeo Designer and SCADAPack RemoteConnect import files."
requires-python = ">=3.10"
dependencies = [
    "pywin32>=306; sys_platform == 'win32'",
    "lxml>=5.0",
    "PySide6>=6.6",
    "xlrd>=2.0",
    "xlwt>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.gui-scripts]
ddt-mirror = "ddt_mirror.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]
